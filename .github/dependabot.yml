# Weekly dependency updates for the three npm packages (root, backend, frontend
# are separate lockfiles, not a workspace), the workflows' actions, and the
# Docker base images.
#
# Minor and patch bumps arrive as ONE grouped pull request per package, so a
# quiet week is one PR to review rather than twenty. Majors arrive one per PR,
# because each can break something on its own.
#
# A new release waits a week before it is proposed: a compromised or broken
# version is usually pulled within days, and nothing here needs a dependency on
# its first day. Neither the grouping nor the wait applies to security updates,
# which (once enabled in the repository's settings) open as soon as an advisory
# lands.
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /backend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      minor-and-patch:
        update-types: [minor, patch]
        # The native modules get a PR each, so the image smoke test in
        # docker-build.yml judges each on its own. sharp is 0.x, where a
        # "minor" bump is a breaking one.
        exclude-patterns: [sharp, sqlite3, onnxruntime-node]

  - package-ecosystem: npm
    directory: /frontend
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      # core, cli and the platforms are meant to move in lockstep (cap sync
      # warns when they disagree), so they come as one PR of their own.
      capacitor:
        patterns: ['@capacitor/*']
        update-types: [minor, patch]
      minor-and-patch:
        update-types: [minor, patch]
        exclude-patterns: ['@capacitor/*']
    ignore:
      # A Capacitor major means migrating the committed native projects under
      # frontend/android and frontend/ios, which a version bump cannot do. Those
      # are done by hand. Named one by one rather than '@capacitor/*' so that
      # @capacitor/assets, a dev-only icon generator with nothing native to
      # migrate (its 3 -> 4 major carries the fixes for the frontend's dev
      # advisories), still gets its majors proposed. Add a new plugin here.
      - dependency-name: '@capacitor/android'
        update-types: [version-update:semver-major]
      - dependency-name: '@capacitor/app'
        update-types: [version-update:semver-major]
      - dependency-name: '@capacitor/cli'
        update-types: [version-update:semver-major]
      - dependency-name: '@capacitor/core'
        update-types: [version-update:semver-major]
      - dependency-name: '@capacitor/file-transfer'
        update-types: [version-update:semver-major]
      - dependency-name: '@capacitor/filesystem'
        update-types: [version-update:semver-major]
      - dependency-name: '@capacitor/ios'
        update-types: [version-update:semver-major]
      - dependency-name: '@capacitor/share'
        update-types: [version-update:semver-major]
      - dependency-name: '@capacitor/status-bar'
        update-types: [version-update:semver-major]

  # Third-party actions are pinned by commit SHA with the version in a comment;
  # Dependabot keeps both current.
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    groups:
      actions:
        patterns: ['*']

  # node:<major>-slim / node:<major>-alpine float on the major, so every image
  # build already picks up that line's patches. A new major is not proposed at
  # all: Node moves deliberately, in one PR that also moves the workflows'
  # node-version, .nvmrc, the engines fields and the docs (AGENTS.md, README,
  # PROJECT.md) — the Dockerfile is only one of the places the version lives, and
  # a Docker-only bump (#173) leaves CI testing a different Node from the image.
  - package-ecosystem: docker
    directory: /
    schedule:
      interval: weekly
    cooldown:
      default-days: 7
    ignore:
      - dependency-name: node
        update-types: [version-update:semver-major]
