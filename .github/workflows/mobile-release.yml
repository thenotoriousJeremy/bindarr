name: Build Mobile Apps

# workflow_dispatch -> build only: uploads packages as workflow artifacts (test).
# push a v* tag  -> release: runs the test suite first, then also uploads the
# Android .aab to Google Play (internal track) and the iOS .ipa to TestFlight, and
# attaches both to the GitHub Release. Store-upload steps are gated on the tag
# event, so dispatch never touches a store.
#
# Pull requests that touch the native projects get a debug build in android.yml.
on:
  push:
    tags: [ "v*" ]
  workflow_dispatch:

permissions:
  contents: read

# One run per ref, never cancelled: a store upload stopped halfway is worse than
# a second run waiting its turn.
concurrency:
  group: mobile-release-${{ github.ref }}
  cancel-in-progress: false

env:
  # Nothing in the frontend uses onnxruntime-node, but every npm ci in the
  # workflows sets this: its install script otherwise downloads ~245 MB of CUDA
  # libraries on Linux.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  # A release ships only what passed the full suite. test.yml does not run on
  # tags, so it runs here for any run on a tag.
  tests:
    if: github.ref_type == 'tag'
    uses: ./.github/workflows/test.yml
    permissions:
      contents: read

  android:
    needs: tests
    # Runs when the tests passed, or were skipped because this is not a release.
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 21

      - name: Build web + sync Capacitor
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync android

      # The version name is the tag without its leading "v" (1.9.0, not v1.9.0),
      # the same number the iOS build gets as MARKETING_VERSION.
      - name: Build APK + AAB
        working-directory: frontend/android
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          BINDARR_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          BINDARR_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          BINDARR_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
          VERSION_TAG: ${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}
          ANDROID_VERSION_CODE: ${{ github.run_number }}
        run: |
          export ANDROID_VERSION_NAME="${VERSION_TAG#v}"
          chmod +x ./gradlew
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > release.keystore
            export BINDARR_KEYSTORE_FILE="$PWD/release.keystore"
            ./gradlew bundleRelease assembleRelease
            echo "APK=frontend/android/app/build/outputs/apk/release/app-release.apk" >> "$GITHUB_ENV"
            echo "AAB=frontend/android/app/build/outputs/bundle/release/app-release.aab" >> "$GITHUB_ENV"
          else
            echo "No keystore secret set — building a debug APK (installable, debug-signed)."
            ./gradlew assembleDebug
            echo "APK=frontend/android/app/build/outputs/apk/debug/app-debug.apk" >> "$GITHUB_ENV"
          fi

      - uses: actions/upload-artifact@v7
        with:
          name: android-apk
          path: ${{ env.APK }}

      - uses: actions/upload-artifact@v7
        if: env.AAB != ''
        with:
          name: android-aab
          path: ${{ env.AAB }}

      - name: Upload to Google Play (internal track)
        if: github.ref_type == 'tag' && env.AAB != ''
        uses: r0adkll/upload-google-play@e738b9dd8f2476ea806d921b64aacd24f34515a5 # v1.1.5
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: com.bindarr.app
          releaseFiles: ${{ env.AAB }}
          track: internal

      # Handed to the release job, which is the only one that can write.
      - name: Rename APK for release
        if: github.ref_type == 'tag'
        run: |
          mkdir -p release
          cp "${{ env.APK }}" release/Bindarr-Android.apk

      - uses: actions/upload-artifact@v7
        if: github.ref_type == 'tag'
        with:
          name: release-android
          path: release/Bindarr-Android.apk
          retention-days: 1

  ios:
    needs: tests
    if: ${{ !cancelled() && (needs.tests.result == 'success' || needs.tests.result == 'skipped') }}
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v7

      - name: Check for Apple signing secrets
        id: gate
        env:
          CERT: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
        run: echo "ready=${{ secrets.IOS_CERTIFICATE_BASE64 != '' }}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-node@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          node-version: 24

      - name: Build web + sync Capacitor
        if: steps.gate.outputs.ready == 'true'
        working-directory: frontend
        run: |
          npm ci
          npm run build
          npx cap sync ios

      - name: Import signing certificate
        if: steps.gate.outputs.ready == 'true'
        uses: apple-actions/import-codesign-certs@288b8ec97b82c66b6f2a6baaf7acc8dfbcbe331c # v7.2.0
        with:
          p12-file-base64: ${{ secrets.IOS_CERTIFICATE_BASE64 }}
          p12-password: ${{ secrets.IOS_CERTIFICATE_PASSWORD }}

      - name: Install provisioning profile
        if: steps.gate.outputs.ready == 'true'
        run: |
          mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
          echo "${{ secrets.IOS_PROVISIONING_PROFILE_BASE64 }}" | base64 -d > ~/Library/MobileDevice/Provisioning\ Profiles/bindarr.mobileprovision

      - name: Write ExportOptions.plist
        if: steps.gate.outputs.ready == 'true'
        working-directory: frontend/ios/App
        run: |
          cat > ExportOptions.plist <<EOF
          <?xml version="1.0" encoding="UTF-8"?>
          <!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd">
          <plist version="1.0">
          <dict>
            <key>method</key><string>app-store</string>
            <key>teamID</key><string>${{ secrets.APPLE_TEAM_ID }}</string>
            <key>signingStyle</key><string>manual</string>
            <key>provisioningProfiles</key>
            <dict>
              <key>com.bindarr.app</key><string>${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}</string>
            </dict>
          </dict>
          </plist>
          EOF

      # The profile goes in BINDARR_PROVISIONING_PROFILE, which only the App
      # target's Release config reads (project.pbxproj), NOT in
      # PROVISIONING_PROFILE_SPECIFIER: a command-line build setting applies to
      # every target, and Swift packages' resource bundles (ZIPFoundation's, via
      # the SQLite plugin) refuse a provisioning profile and fail the archive.
      - name: Archive
        if: steps.gate.outputs.ready == 'true'
        working-directory: frontend/ios/App
        run: |
          VERSION="${{ github.ref_type == 'tag' && github.ref_name || '0.0.0' }}"
          xcodebuild -project App.xcodeproj -scheme App -configuration Release \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -destination 'generic/platform=iOS' \
            MARKETING_VERSION="${VERSION#v}" \
            CURRENT_PROJECT_VERSION=${{ github.run_number }} \
            CODE_SIGN_STYLE=Manual \
            CODE_SIGN_IDENTITY="Apple Distribution" \
            DEVELOPMENT_TEAM=${{ secrets.APPLE_TEAM_ID }} \
            BINDARR_PROVISIONING_PROFILE="${{ secrets.IOS_PROVISIONING_PROFILE_NAME }}" \
            archive

      - name: Export IPA
        if: steps.gate.outputs.ready == 'true'
        working-directory: frontend/ios/App
        run: |
          xcodebuild -exportArchive \
            -archivePath $RUNNER_TEMP/App.xcarchive \
            -exportOptionsPlist ExportOptions.plist \
            -exportPath $RUNNER_TEMP/export

      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.ready == 'true'
        with:
          name: ios-ipa
          path: ${{ runner.temp }}/export/*.ipa

      - name: Upload to TestFlight
        if: steps.gate.outputs.ready == 'true' && github.ref_type == 'tag'
        env:
          ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
          ASC_API_KEY_BASE64: ${{ secrets.ASC_API_KEY_BASE64 }}
        run: |
          mkdir -p ~/.appstoreconnect/private_keys
          echo "$ASC_API_KEY_BASE64" | base64 -d > ~/.appstoreconnect/private_keys/AuthKey_${ASC_KEY_ID}.p8
          IPA=$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)
          xcrun altool --upload-app --type ios --file "$IPA" \
            --apiKey "$ASC_KEY_ID" --apiIssuer "$ASC_ISSUER_ID"

      # Handed to the release job, which is the only one that can write.
      - name: Rename IPA for release
        if: steps.gate.outputs.ready == 'true' && github.ref_type == 'tag'
        run: cp "$(ls "$RUNNER_TEMP"/export/*.ipa | head -1)" "$RUNNER_TEMP/Bindarr-Apple-iOS.ipa"

      - uses: actions/upload-artifact@v7
        if: steps.gate.outputs.ready == 'true' && github.ref_type == 'tag'
        with:
          name: release-ios
          path: ${{ runner.temp }}/Bindarr-Apple-iOS.ipa
          retention-days: 1

  # The only job that can write to the repository, and it runs no install, build
  # or signing step: it attaches the packages the jobs above uploaded. The APK
  # goes out whether or not iOS built, as it always has.
  release:
    needs: [android, ios]
    if: ${{ !cancelled() && github.ref_type == 'tag' && needs.android.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: assets
          pattern: release-*
          merge-multiple: true

      - name: Attach to release
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          files: assets/*
