name: TCGCSV mirror

# One daily copy of TCGCSV's Pokémon data for every Bindarr install, so the
# traffic TCGCSV sees from Bindarr is one sync a day instead of one per instance.
# See scripts/tcgcsv-mirror/sync.mjs for the request rules it follows.
#
# Published to the orphan branch `tcgcsv-mirror` as a single force-pushed commit,
# read by instances through
#   https://raw.githubusercontent.com/thenotoriousJeremy/bindarr/tcgcsv-mirror
# Not GitHub Pages: Pages already serves the demo (pages-demo.yml), and a second
# deploy would replace it.
on:
  workflow_dispatch:
    inputs:
      force:
        description: Full sync even if TCGCSV's last-updated.txt has not moved
        type: boolean
        default: false
  # Enable once the TCGCSV maintainer approves the mirror. Until then this runs
  # only when dispatched by hand. TCGCSV refreshes around 20:00 UTC; 23:17 leaves
  # it hours to finish and stays off the top of the hour.
  # schedule:
  #   - cron: '17 23 * * *'

permissions:
  contents: write

# Two overlapping runs would double the requests and race the force-push.
concurrency:
  group: tcgcsv-mirror
  cancel-in-progress: false

env:
  # The two categories backend/src/tcgcsvApi.js reads (CATEGORY): Pokemon and
  # Pokemon Japan.
  CATEGORIES: '3,85'
  MIRROR_BRANCH: tcgcsv-mirror

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20

      # Offline, fixture-backed; a broken script must not get to talk to TCGCSV.
      - name: Test sync script
        run: node --test scripts/tcgcsv-mirror/sync.test.mjs

      # Read the published marker from git rather than raw.githubusercontent.com,
      # whose CDN can serve a copy several minutes stale. Fetching the tip also lets
      # the push below upload only the files that changed.
      - name: Fetch published mirror
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p "$RUNNER_TEMP/mirror"
          cd "$RUNNER_TEMP/mirror"
          git init -q
          git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git"
          if git fetch -q --depth=1 origin "$MIRROR_BRANCH"; then
            git show FETCH_HEAD:last-updated.txt > "$RUNNER_TEMP/previous-last-updated.txt" || true
          fi
          touch "$RUNNER_TEMP/previous-last-updated.txt"
          echo "Published copy: $(cat "$RUNNER_TEMP/previous-last-updated.txt" || true)"

      - name: Sync from TCGCSV
        id: sync
        run: |
          set +e
          previous="$RUNNER_TEMP/previous-last-updated.txt"
          if [ "${{ inputs.force }}" = "true" ]; then previous=""; fi
          node scripts/tcgcsv-mirror/sync.mjs \
            --out "$RUNNER_TEMP/mirror" \
            --categories "$CATEGORIES" \
            --previous-last-updated "$previous"
          code=$?
          set -e
          case "$code" in
            0)  echo "changed=true" >> "$GITHUB_OUTPUT" ;;
            78) echo "changed=false" >> "$GITHUB_OUTPUT" ;;
            *)  exit "$code" ;;
          esac

      # GitHub refuses any file over 100 MB; fail here with a clear message instead
      # of at the push.
      - name: Check sizes
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mirror"
          du -sh --exclude=.git .
          find . -path ./.git -prune -o -type f -printf '%s\t%p\n' | sort -rn | head -5
          big=$(find . -path ./.git -prune -o -type f -size +90M -print)
          if [ -n "$big" ]; then echo "::error::files over 90 MB: $big"; exit 1; fi

      - name: Publish
        if: steps.sync.outputs.changed == 'true'
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP/mirror"
          cat > README.md <<'EOF'
          # TCGCSV mirror for Bindarr

          A daily copy of [TCGCSV](https://tcgcsv.com)'s Pokémon data (TCGplayer
          categories 3 and 85), in TCGCSV's own path layout, so Bindarr installs can
          read it with `TCGCSV_BASE_URL` instead of each syncing from TCGCSV.
          Generated by `.github/workflows/tcgcsv-mirror.yml` on `main`; this branch is
          replaced by a single commit on every run. The data is TCGplayer's, as
          collected by TCGCSV.
          EOF
          git symbolic-ref HEAD "refs/heads/$MIRROR_BRANCH"
          git add -A
          git -c user.name='github-actions[bot]' \
              -c user.email='41898283+github-actions[bot]@users.noreply.github.com' \
              commit -q -m "TCGCSV mirror $(cat last-updated.txt)"
          # Orphan commit, force-pushed: the branch holds one snapshot, never history.
          git push -q --force origin "HEAD:refs/heads/$MIRROR_BRANCH"
