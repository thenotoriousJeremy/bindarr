name: Check Translations

# Translation contributions arrive as pull requests that touch only
# frontend/src/locales. This is the gate for them: no build, no install, just the
# checker, so a translator gets an answer in seconds instead of waiting on a full
# frontend build. See docs/TRANSLATING.md.
on:
  pull_request:
    paths: [ 'frontend/src/locales/**' ]
  push:
    branches: [ main ]
    paths: [ 'frontend/src/locales/**' ]
  workflow_dispatch:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check locale files against en.json
        working-directory: frontend
        run: npm run check:locales
