name: Build and Publish Docker Image

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
    branches: [ "main" ]
  # Lets a tag be rebuilt/re-tagged without moving the git tag (run this
  # workflow against a v* ref to republish its image tags).
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24

      - name: Install backend dependencies
        run: npm ci
        working-directory: backend

      # Hard gate: backend tests must pass before an image is built/pushed.
      - name: Backend tests
        run: npm test
        working-directory: backend

      - name: Install frontend dependencies
        run: npm ci
        working-directory: frontend

      # Enforcing: the frontend lints clean (0 problems). Keep it that way.
      - name: Lint frontend
        run: npm run lint
        working-directory: frontend

  # One leg per architecture, each on a runner of that architecture. QEMU
  # emulation was the alternative and it is far slower here: the image compiles
  # sqlite3 from source (see Dockerfile), which under emulation dominates the
  # build. Native runners are free on public repos, so each leg builds at full
  # speed and the two run in parallel.
  #
  # Each leg pushes an untagged image and reports its digest; the `merge` job
  # below assembles the digests into one multi-arch tag. Legs cannot push tags
  # themselves — two pushes to the same tag would leave whichever finished last,
  # not a manifest list covering both.
  build:
    needs: verify
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: linux/amd64
            arch: amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # GHCR rejects upper case in a repository name and this owner has one, so
      # the raw docker commands below cannot use github.repository directly.
      # (metadata-action lowercases its own output, but imagetools does not.)
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}

      - name: Build and push image by digest
        id: build
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          labels: ${{ steps.meta.outputs.labels }}
          # Per-arch cache scopes. A shared scope would have the two legs
          # overwrite each other's manifest every run and neither would hit.
          cache-from: type=gha,scope=${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=${{ matrix.arch }}
          # Provenance attestations show up in the GHCR package list as
          # extra `unknown/unknown` platform rows once the tag is a manifest
          # list. Nothing consumes them here.
          provenance: false
          outputs: type=image,name=${{ steps.image.outputs.name }},push-by-digest=true,name-canonical=true,push=${{ github.event_name != 'pull_request' }}

      # The build above proves the image compiles, not that it runs. The native
      # modules (sqlite3 compiled in the image, sharp and onnxruntime-node from
      # prebuilts) only fail when they are loaded, and a Node or base-image bump is
      # exactly when they would. Rebuilt from the cache the step above just wrote,
      # so this is an export, not a second compile. Runs before `merge` applies any
      # tag, so an image that cannot start is never published as a release.
      - name: Load image for smoke test
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: ${{ matrix.platform }}
          cache-from: type=gha,scope=${{ matrix.arch }}
          provenance: false
          load: true
          tags: bindarr:smoke

      - name: Smoke test the image
        run: |
          docker run --rm --entrypoint node bindarr:smoke -e \
            "require('sqlite3'); require('sharp'); require('onnxruntime-node'); console.log('native modules load on', process.version, process.arch)"
          docker run -d --name smoke -p 3001:3001 bindarr:smoke
          ok=0
          for i in $(seq 1 45); do
            if curl -fsS http://localhost:3001/api/health; then ok=1; break; fi
            sleep 2
          done
          echo; echo '--- container log ---'
          docker logs smoke
          docker rm -f smoke > /dev/null
          [ "$ok" = 1 ] || { echo "::error::The image never answered /api/health."; exit 1; }

      # A file per digest, named after it, so `merge` can collect the set from
      # both legs without knowing which architectures ran.
      - name: Export digest
        if: github.event_name != 'pull_request'
        run: |
          mkdir -p /tmp/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "/tmp/digests/${digest#sha256:}"

      - name: Upload digest
        if: github.event_name != 'pull_request'
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  # Applies the release tags to a manifest list covering every architecture
  # built above. Skipped on pull_request, where nothing was pushed to tag.
  merge:
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Resolve image name
        id: image
        run: echo "name=ghcr.io/${GITHUB_REPOSITORY,,}" >> "$GITHUB_OUTPUT"

      - name: Download digests
        uses: actions/download-artifact@v4
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GitHub Container Registry (GHCR)
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels) for Docker
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.image.outputs.name }}
          # `latest` follows the newest RELEASE, not main. The README tells
          # self-hosters to run :latest, and main can contain unreleased work —
          # gating it on refs/heads/main silently handed them untagged code.
          # It also meant `latest` and the version numbers were applied by two
          # separate runs (main push, then tag push), so they landed on two
          # different digests and never appeared together in the registry.
          # Main now publishes `edge` for anyone who wants to track it.
          tags: |
            type=raw,value=latest,enable=${{ startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=edge,enable=${{ github.ref == 'refs/heads/main' }}
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha,format=short

      - name: Create manifest list and push
        working-directory: /tmp/digests
        run: |
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<< "$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf '${{ steps.image.outputs.name }}@sha256:%s ' *)

      - name: Inspect published manifest
        run: docker buildx imagetools inspect ${{ steps.image.outputs.name }}:${{ steps.meta.outputs.version }}
