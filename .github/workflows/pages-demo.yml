name: Deploy Demo to GitHub Pages

# Builds the frontend in demo mode (fixture-backed, no backend) and publishes it
# to GitHub Pages. Manual dispatch, plus any push to main that touches the
# frontend. Enable Pages -> Source: GitHub Actions in repo settings once.
on:
  workflow_dispatch:
  push:
    branches: [ main ]
    paths: [ 'frontend/**' ]

# Nothing by default; each job asks for what it needs. The build runs npm ci and
# the whole frontend toolchain, so it can only read (configure-pages reads the
# site's settings); the deploy job, which runs nothing but deploy-pages, holds
# the write permissions.
permissions: {}

# One live deploy at a time; don't cancel an in-progress one.
concurrency:
  group: pages
  cancel-in-progress: false

env:
  # Nothing in the frontend uses onnxruntime-node, but every npm ci in the
  # workflows sets this: its install script otherwise downloads ~245 MB of CUDA
  # libraries on Linux.
  ONNXRUNTIME_NODE_INSTALL_CUDA: skip

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
      - name: Build demo bundle
        working-directory: frontend
        env:
          VITE_DEMO: '1'
        run: |
          npm ci
          npm run build
      - uses: actions/configure-pages@v6
      - uses: actions/upload-pages-artifact@v5
        with:
          path: frontend/dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v5
